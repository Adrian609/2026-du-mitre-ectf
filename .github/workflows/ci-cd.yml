name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-check:
    name: Python package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ./ectf26_design

      - name: Smoke test secrets CLI
        run: |
          secrets ci.global.secrets 1234
          test -s ci.global.secrets
          rm -f ci.global.secrets

      - name: Validate package build
        run: python -m build --sdist --wheel ./ectf26_design

  firmware-build:
    name: Firmware Docker build
    runs-on: ubuntu-latest
    needs: python-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CI secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./ectf26_design
          secrets global.secrets 1234

      - name: Build firmware Docker image
        run: make docker

      - name: Build HSM artifact
        run: make ci.hsm PIN=123456 PERMS='1234=RWC'

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hsm
          path: |
            ci.hsm/hsm.bin
            ci.hsm/hsm.elf
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: firmware-build
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-hsm
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/hsm.bin
            release-assets/hsm.elf
