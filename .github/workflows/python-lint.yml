name: Python Lint & Format

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ectf26_design/**'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ectf26_design/**'
      - '.github/workflows/python-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint

      - name: Run Black formatter check
        run: black --check ectf26_design/src/

      - name: Run Flake8 linter
        run: flake8 ectf26_design/src/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run Pylint
        continue-on-error: true
        run: pylint ectf26_design/src/ --disable=all --enable=E,F
