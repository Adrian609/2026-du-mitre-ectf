name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'firmware/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'firmware/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./firmware
          push: false
          tags: build-hsm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image build
        run: |
          docker build -t build-hsm:test ./firmware/
          docker image inspect build-hsm:test
