name: Secrets Generation

on:
  push:
    branches:
      - main
    paths:
      - 'ectf26_design/**'
      - '.github/workflows/python-secrets.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ectf26_design/**'
      - '.github/workflows/python-secrets.yml'
  workflow_dispatch:
    inputs:
      groups:
        description: 'Space-separated group IDs (e.g., 1234 5678)'
        required: false
        default: '1234'

jobs:
  validate-secrets-generation:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install project
        run: |
          cd ectf26_design
          pip install -e .

      - name: Validate secrets generation script
        run: |
          cd ectf26_design/src
          python gen_secrets.py --help || echo "Help flag not available"

      - name: Test secrets generation (dry-run simulation)
        run: |
          cd ectf26_design/src
          python -c "from gen_secrets import main; print('Secrets generation module valid')"

      - name: Run secrets generation command via uvx
        if: github.event_name == 'workflow_dispatch'
        run: |
          uvx --with-editable ./ectf26_design --from ectf26_design secrets global.secrets ${{ github.event.inputs.groups }} 2>&1 | head -20 || true
